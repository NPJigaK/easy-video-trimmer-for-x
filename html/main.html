<!-- =====================================================================
     main.html – Stand‑alone trimming UI for "Easy Video Trimmer for X.com"
     This page is opened as a popup window from inject‑button.js.
     * No network calls: everything runs client‑side (HTML5 video + FFmpeg WASM)
     * Flow: choose file → timeline/trim → FFmpeg → download
     ===================================================================== -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Easy Video Trimmer for X.com — Beta Version</title>

    <!-- App‑specific styling / Twitter‑like dark theme -->
    <link href="../css/main.css" rel="stylesheet" />
</head>

<body>
    

    <!-- =============================================================
              1. File selection view – initial state (drag & drop allowed)
              ============================================================= -->
    <div id="pre-extension-container" style="display: contents">
    <h1>Easy Video Trimmer for X.com — Beta Version</h1>
        <!-- 1‑A: Drag‑and‑Drop area -->
        <div id="dropArea">
            <p>Open file or Drop file here</p>
        </div>

        <!-- 1‑B: Fallback "select file" button (hidden <input> below) -->
        <label for="fileInput" class="upload-btn">Open file</label>
        <input id="fileInput" type="file" accept="video/*" />
    </div>

    <!-- 1‑C: Selected file metadata (name / size / duration) -->
    <div id="fileInfo"></div>

    <!-- =============================================================
              2. Main editing view – file loaded ⇒ JS toggles display:block
              ============================================================= -->
    <div id="main-extension-container" class="main-container" style="position: relative">
        <!-- Close / Reset button (resets player & returns to drop view) -->
        <button id="closeButton" title="Close">×</button>

        <div class="app">
            <div class="panel timeline-area">
                <video id="video" preload="metadata" crossorigin="anonymous"></video>
                <video id="previewVideo" muted preload="metadata" playsinline crossorigin="anonymous"></video>

                <div class="controls-row top-row">
                    <button id="zoomOutBtn">Zoom -</button>
                    <button id="zoomInBtn">Zoom +</button>
                    <button id="importBtn">Import Video</button>
                    <div class="spacer"></div>
                    <div class="tag">Ctrl+Wheel to zoom</div>
                    <div class="tag">Alt+Wheel to pan</div>
                    <div class="tag">Space to play/pause</div>
                </div>

                <div id="timeline" class="timeline-container" role="slider" tabindex="0" aria-label="Video timeline"
                    aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
                    <div class="ticks" id="tickStrip"></div>
                    <div class="clip-layer" id="clipLayer">
                        <div class="clip-highlight" id="clipHighlight" title="Drag to move clip"></div>
                        <div class="clip-handle left" id="clipHandleStart" title="Drag to adjust start"></div>
                        <div class="clip-handle right" id="clipHandleEnd" title="Drag to adjust end"></div>
                    </div>
                    <div class="playhead" id="playhead" title="Drag to scrub"></div>
                    <div class="hover-preview" id="hoverPreview">
                        <canvas id="hoverPreviewCanvas" width="180" height="100"></canvas>
                        <div class="hover-preview-time" id="hoverPreviewTime">0:00</div>
                    </div>
                </div>

                <div id="overview" class="overview-container">
                    <div id="overviewThumb" class="overview-thumb"></div>
                    <div id="overviewPlayhead" class="overview-playhead"></div>
                </div>

                <div class="controls-row-bottom">
                    <div class="row-slot"></div>
                    <div class="center-controls">
                        <button id="stepLeftBtn" class="ghost-btn" title="Step 1 frame back">&lt;</button>
                        <button id="back10Btn" title="Back 10s">&#8630;10</button>
                        <button id="playPauseCenterBtn" class="play-main" title="Play/Pause">&gt;</button>
                        <button id="forward10Btn" title="Forward 10s">10&#8631;</button>
                        <button id="stepRightBtn" class="ghost-btn" title="Step 1 frame forward">&gt;</button>
                    </div>
                    <div class="row-slot right">
                        <button id="playFromClipBtn" disabled>Play from Clip Start</button>
                        <div class="clip-action">
                            <button id="clipBtn">✂ Clip</button>
                        </div>
                    </div>
                </div>

                <div class="time-readout" id="timeReadout">0:00 / 0:00</div>

                <div class="label-row">
                    <div class="label-slot"></div>
                    <div class="clip-label" id="clipLabel">Clip inactive</div>
                    <div class="label-action">
                        <button id="log-range-btn" class="attach-btn" disabled>Clip video & attach to X.com</button>
                    </div>
                </div>

                <div id="status-box" class="status-box" style="display: none;"></div>
                <div id="myProgress" class="video-progress"></div>
            </div>
        </div>
    </div>

    <!-- =============================================================
              3. Script pipeline  (order matters!)
              ============================================================= -->
    <!-- FFmpeg WASM (UMD) + thin util wrapper (fetchFile) -->
    <script src="../lib/ffmpeg/ffmpeg/ffmpeg.js"></script>
    <script src="../lib/ffmpeg/util/util.js"></script>

    <!-- WebCodecs H.264 encoder (hardware-accel path) -->
    <script src="../js/encoder/webcodecs-encoder.js"></script>

    <!-- App logic: FFmpeg bootstrap & UI wiring -->
    <script src="../js/ffmpeg-controller.js"></script>
    <script src="../js/content.js"></script>
</body>

</html>
